name: Attorney and USCIS claims

on:
  schedule:
    # 04:00 UTC every Monday = 9:00 AM PKT — catches a new claim within a week
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      months_back:
        description: "How many months to look back"
        required: true
        default: "3"
        type: string
      send_email:
        description: "Email the report?"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the rules still work
        run: node selftest.js
      - run: node watch.js
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          MONTHS_BACK: ${{ inputs.months_back }}
          SEND_EMAIL: ${{ inputs.send_email }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claims-report
          path: out/
          retention-days: 30
          if-no-files-found: ignore
